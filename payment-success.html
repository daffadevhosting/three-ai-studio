---
layout: default
title: "Payment Status - Three.js AI Studio"
lang: en
fontawesome: "6.4.0"
stylesheet: /assets/css/payment-success.css
---

<div id="loadingOverlay">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading payment details...</p>
    </div>

    {% include site-header.html %}

    <div class="container">
        <div class="payment-status-card">
            <div id="statusIcon" class="status-icon"></div>
            <h1 id="statusTitle" class="status-title"></h1>
            <p id="statusMessage" class="status-message"></p>

            <div id="paymentDetails" class="details-card" style="display: none;">
                <div class="detail-item">
                    <span class="detail-label">Tokens Added:</span>
                    <span id="tokensAdded" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Plan:</span>
                    <span id="planName" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Amount Paid:</span>
                    <span id="amountPaid" class="detail-value"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Transaction ID:</span>
                    <span id="transactionId" class="detail-value"></span>
                </div>
            </div>

            <div class="actions">
                <a href="./" class="btn btn-primary">
                    <i class="fas fa-code"></i> Go to Workspace
                </a>
                <a href="./billing" class="btn btn-secondary">
                    <i class="fas fa-credit-card"></i> View Billing
                </a>
                <button class="btn btn-secondary" onclick="window.close()">
                    <i class="fas fa-times"></i> Close Window
                </button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="common.js"></script>
    <script>
        const API_BASE = 'https://three-ai-studio.warpzone.workers.dev';
        const auth = new Auth(API_BASE);

        document.addEventListener('DOMContentLoaded', function() {
            auth.redirectIfUnauthenticated();
            initializePage();
        });

        async function initializePage() {
            const urlParams = new URLSearchParams(window.location.search);
            const isSuccess = urlParams.get('success') === 'true';
            const isCancelled = urlParams.get('cancelled') === 'true';
            const isError = urlParams.get('error') === 'payment_failed';
            const sessionId = urlParams.get('sessionId');

            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'flex'; // Show loading initially

            // Load user profile for header
            const userData = await loadUserProfile(API_BASE, auth.getToken());
            if (userData) {
                document.getElementById('userName').textContent = userData.user.name;
                setUserAvatar(document.getElementById('userAvatar'), userData.user.avatar);
            }

            if (isSuccess && sessionId) {
                await displaySuccess(sessionId);
            } else if (isCancelled) {
                displayCancelled();
            } else if (isError) {
                displayError();
            } else {
                // Default to error if no clear status
                displayError("An unknown payment status occurred.");
            }

            loadingOverlay.style.display = 'none'; // Hide loading after processing

            // Notify parent window if opened in popup
            if (window.opener) {
                window.opener.postMessage({ type: 'payment_completed' }, '*');
                // No auto-close, let user navigate
            }
        }

        async function displaySuccess(sessionId) {
            document.getElementById('statusIcon').className = 'status-icon success fas fa-check-circle';
            document.getElementById('statusTitle').textContent = 'Payment Successful!';
            document.getElementById('statusMessage').textContent = 'Your tokens have been successfully added to your account.';
            
            try {
                const response = await fetch(`${API_BASE}/api/payment/status/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${auth.getToken()}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const payment = data.payment;

                    document.getElementById('tokensAdded').textContent = payment.tokens.toLocaleString();
                    document.getElementById('planName').textContent = payment.plan;
                    document.getElementById('amountPaid').textContent = `$${payment.amount.toFixed(2)}`;
                    document.getElementById('transactionId').textContent = payment.orderId;
                    document.getElementById('paymentDetails').style.display = 'block';
                } else {
                    console.error('Failed to fetch payment details:', response.statusText);
                    document.getElementById('statusMessage').textContent += ' (Could not load details.)';
                }
            } catch (error) {
                console.error('Error fetching payment details:', error);
                document.getElementById('statusMessage').textContent += ' (Error loading details.)';
            }
        }

        function displayCancelled() {
            document.getElementById('statusIcon').className = 'status-icon error fas fa-times-circle';
            document.getElementById('statusTitle').textContent = 'Payment Cancelled';
            document.getElementById('statusMessage').textContent = 'Your payment was cancelled. No charges were made.';
        }

        function displayError(message = 'There was an issue processing your payment. Please try again or contact support.') {
            document.getElementById('statusIcon').className = 'status-icon error fas fa-exclamation-triangle';
            document.getElementById('statusTitle').textContent = 'Payment Failed!';
            document.getElementById('statusMessage').textContent = message;
        }
    </script>
