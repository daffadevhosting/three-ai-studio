<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title | escape }}</title>
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
{% if page.bootstrap %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% endif %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/{{ page.fontawesome | default: '6.4.0' }}/css/all.min.css" rel="stylesheet">
{% if page.stylesheets %}
{% for stylesheet in page.stylesheets %}
<link rel="stylesheet" href="{{ stylesheet | relative_url }}">
{% endfor %}
{% elsif page.stylesheet %}
<link rel="stylesheet" href="{{ page.stylesheet | relative_url }}">
{% endif %}
